server:
  port: ${AUDIT_PORT:8084}

spring:
  application:
    name: audit-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      # Native SQL (e.g. the RFQ number sequence) resolves in this service schema too
      schema: audit
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": audit
  flyway:
    enabled: true
    schemas: audit
    default-schema: audit
    # Migrations live with the service: src/main/resources/db/migration (V1 domain tables, then changes).
    locations: ${AUDIT_MIGRATIONS:classpath:db/migration}

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  audit:
    # The audit service stores events directly; it has nothing to relay.
    outbox-relay: false
  services:
    audit: http://localhost:${AUDIT_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
