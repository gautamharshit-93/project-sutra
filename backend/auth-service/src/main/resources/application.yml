server:
  port: ${AUTH_PORT:8081}

spring:
  application:
    name: auth-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      # Native SQL (e.g. the RFQ number sequence) resolves in this service schema too
      schema: auth
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": auth
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    # Migrations live with the service: src/main/resources/db/migration (V1 domain tables, then changes).
    locations: ${AUTH_MIGRATIONS:classpath:db/migration}
    # Foreign keys into other services' schemas (same database); off where a schema is tested alone.
    placeholders:
      crossSchemaFks: ${CROSS_SCHEMA_FKS:true}

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    public-paths: /api/auth/login, /api/auth/register-vendor
  auth:
    bootstrap-admin:
      username: ${SUTRA_ADMIN_USERNAME:admin}
      password: ${SUTRA_ADMIN_PASSWORD:Admin@123}
      email: ${SUTRA_ADMIN_EMAIL:admin@sutra.local}
    # Sign-in is locked for lockout-minutes after this many consecutive failures.
    max-failed-logins: ${SUTRA_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${SUTRA_LOCKOUT_MINUTES:15}
  services:
    masterdata: ${MASTERDATA_URL:http://localhost:8082}
    rfq: ${RFQ_URL:http://localhost:8083}
    quotation: ${QUOTATION_URL:http://localhost:8085}
    approval: ${APPROVAL_URL:http://localhost:8089}
    audit: ${AUDIT_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
