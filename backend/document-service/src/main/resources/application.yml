server:
  port: ${DOCUMENT_PORT:8086}

spring:
  application:
    name: document-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      schema: document
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": document
  flyway:
    enabled: true
    schemas: document
    default-schema: document
    # Migrations live with the service: src/main/resources/db/migration
    locations: ${DOCUMENT_MIGRATIONS:classpath:db/migration}
    # Foreign keys into other services' schemas (same database); off where a schema is tested alone.
    placeholders:
      crossSchemaFks: ${CROSS_SCHEMA_FKS:true}
  servlet:
    multipart:
      max-file-size: ${SUTRA_MAX_FILE_MB:20}MB
      max-request-size: ${SUTRA_MAX_REQUEST_MB:210}MB

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  services:
    audit: ${AUDIT_URL:http://localhost:8084}
  files:
    max-size-bytes: ${SUTRA_MAX_FILE_BYTES:20971520}
    # Uploads never attached to a quotation (the upload failed half-way) are removed after this long.
    orphan-after-minutes: ${SUTRA_ORPHAN_AFTER_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
