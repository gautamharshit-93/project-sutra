# Integration tests run against a real PostgreSQL database (sutra_test); the procurement schema is wiped and
# rebuilt from /database/procurement on each run.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/sutra_test}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
  flyway:
    clean-disabled: false

sutra:
  ai:
    groq:
      api-key: ""      # tests never call the real Groq API
    ocr:
      enabled: false
  extraction:
    engine-order: RULES
  audit:
    outbox-relay: false   # events stay in the outbox, where the test can see them
  services:
    masterdata: http://localhost:1   # mocked
    audit: http://localhost:1

logging:
  level:
    "[com.sutra]": WARN
