# Integration tests run against a real PostgreSQL database (sutra_test), rebuilt from the migrations each run.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/sutra_test}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
  flyway:
    clean-disabled: false

sutra:
  ai:
    gemini:
      api-key: ""      # tests never call the real Gemini API; the extractor is mocked
  extraction:
    # Only the (mocked) Gemini engine, so a simulated Gemini failure is not rescued by another engine.
    engine-order: GEMINI
  bootstrap-admin:
    username: admin
    password: Admin@123
    email: admin@test.local

logging:
  level:
    "[com.sutra]": WARN
