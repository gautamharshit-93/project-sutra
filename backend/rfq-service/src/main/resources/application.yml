server:
  port: ${RFQ_PORT:8083}

spring:
  application:
    name: rfq-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      schema: rfq
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": rfq
  flyway:
    enabled: true
    schemas: rfq
    default-schema: rfq
    # Migrations live with the service: src/main/resources/db/migration
    locations: ${RFQ_MIGRATIONS:classpath:db/migration}
    # Foreign keys into other services' schemas (same database); off where a schema is tested alone.
    placeholders:
      crossSchemaFks: ${CROSS_SCHEMA_FKS:true}

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  services:
    masterdata: ${MASTERDATA_URL:http://localhost:8082}
    quotation: ${QUOTATION_URL:http://localhost:8085}
    audit: ${AUDIT_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
