# Integration tests run against a real PostgreSQL database (sutra_test) in their own schema (rfq_it), wiped and
# rebuilt from this service's migrations on each run. The other services are mocked (their clients).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/sutra_test}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      schema: rfq_it
  jpa:
    properties:
      "[hibernate.default_schema]": rfq_it
  flyway:
    schemas: rfq_it
    default-schema: rfq_it
    clean-disabled: false
    placeholders:
      crossSchemaFks: "false"   # the other services' schemas are not part of this test

sutra:
  audit:
    outbox-relay: false   # events stay in the outbox, where the test can see them
  services:
    masterdata: http://localhost:1
    rfq: http://localhost:1
    quotation: http://localhost:1
    document: http://localhost:1
    extraction: http://localhost:1
    comparison: http://localhost:1
    approval: http://localhost:1
    audit: http://localhost:1

logging:
  level:
    "[com.sutra]": WARN
