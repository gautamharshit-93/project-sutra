server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  # Uploads are streamed straight through to the procurement service, never parsed here.
  servlet:
    multipart:
      enabled: false
  web:
    error:
      include-message: never
      include-stacktrace: never

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  gateway:
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    auth-url: ${AUTH_URL:http://localhost:8081}
    document-service-url: ${AI_SERVICE_URL:http://localhost:8000}
    # How long a user's active/version state is trusted before asking the auth service again.
    token-check-cache-seconds: 15
    # Cross-checking a quotation with every engine can take minutes.
    request-timeout-seconds: 600
    # Sign-in and vendor sign-up: requests per minute from one IP address.
    public-rate-limit-per-minute: ${SUTRA_PUBLIC_RATE_LIMIT:20}
    # First match wins: the specific RFQ sub-paths (history, drafts, quotations, comparisons, approvals, award
    # summary) go to the service that owns them before the general /api/purchase-requests/** route.
    routes:
      - service: auth service
        url: ${AUTH_URL:http://localhost:8081}
        paths: [/api/auth/**, /api/users/**]
      - service: master data service
        url: ${MASTERDATA_URL:http://localhost:8082}
        paths: [/api/entities/**, /api/customers/**, /api/vendors/**, /api/vendor-profile/**, /api/vendor-profile]
      - service: audit service
        url: ${AUDIT_URL:http://localhost:8084}
        paths: [/api/audit-logs/**, /api/purchase-requests/*/history, /api/quotations/*/history]
      - service: extraction service
        url: ${EXTRACTION_URL:http://localhost:8087}
        paths: [/api/purchase-requests/draft-from-files, /api/purchase-requests/draft-from-text,
                /api/extraction-engines/**, /api/extractions/**, /api/extractions]
      - service: reporting service
        url: ${REPORTING_URL:http://localhost:8090}
        paths: [/api/dashboard/**, /api/dashboard, /api/assistant/**, /api/vendor-portal/badges,
                /api/purchase-requests/*/award-summary]
      - service: comparison service
        url: ${COMPARISON_URL:http://localhost:8088}
        paths: [/api/purchase-requests/*/comparisons, /api/comparisons/**]
      - service: approval service
        url: ${APPROVAL_URL:http://localhost:8089}
        paths: [/api/purchase-requests/*/approvals]
      - service: quotation service
        url: ${QUOTATION_URL:http://localhost:8085}
        paths: [/api/purchase-requests/*/quotations, /api/quotations/**, /api/vendor-portal/**]
      - service: RFQ service
        url: ${RFQ_URL:http://localhost:8083}
        paths: [/api/purchase-requests/**, /api/purchase-requests]
      # Internal only (no public paths): listed so the service status page checks it.
      - service: document service
        url: ${DOCUMENT_URL:http://localhost:8086}
        paths: []

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
