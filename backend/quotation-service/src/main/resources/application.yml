server:
  port: ${QUOTATION_PORT:8085}

spring:
  application:
    name: quotation-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      schema: quotation
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": quotation
  flyway:
    enabled: true
    schemas: quotation
    default-schema: quotation
    # Migrations live with the service: src/main/resources/db/migration
    locations: ${QUOTATION_MIGRATIONS:classpath:db/migration}
    # Foreign keys into other services' schemas (same database); off where a schema is tested alone.
    placeholders:
      crossSchemaFks: ${CROSS_SCHEMA_FKS:true}
  servlet:
    multipart:
      max-file-size: ${SUTRA_MAX_FILE_MB:20}MB
      max-request-size: ${SUTRA_MAX_REQUEST_MB:210}MB

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  services:
    masterdata: ${MASTERDATA_URL:http://localhost:8082}
    rfq: ${RFQ_URL:http://localhost:8083}
    document: ${DOCUMENT_URL:http://localhost:8086}
    extraction: ${EXTRACTION_URL:http://localhost:8087}
    comparison: ${COMPARISON_URL:http://localhost:8088}
    approval: ${APPROVAL_URL:http://localhost:8089}
    audit: ${AUDIT_URL:http://localhost:8084}
  ai:
    review-confidence-threshold: 0.75
    match-confidence-threshold: 0.6

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
