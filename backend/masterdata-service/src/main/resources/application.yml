server:
  port: ${MASTERDATA_PORT:8082}

spring:
  application:
    name: masterdata-service
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sutra_db}
    username: ${DB_USERNAME:sutra}
    password: ${DB_PASSWORD:sutra_pass}
    hikari:
      # Native SQL (e.g. the RFQ number sequence) resolves in this service schema too
      schema: masterdata
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.default_schema]": masterdata
  flyway:
    enabled: true
    schemas: masterdata
    default-schema: masterdata
    # The SQL in /database/masterdata is the single source of truth for this service's schema.
    locations: ${MASTERDATA_MIGRATIONS:filesystem:../../database/masterdata}

sutra:
  security:
    # Shared by every service. Override JWT_SECRET in any shared environment (min 32 chars).
    jwt-secret: ${JWT_SECRET:change-me-sutra-dev-secret-key-at-least-32-chars}
  services:
    auth: ${AUTH_URL:http://localhost:8081}
    procurement: ${PROCUREMENT_URL:http://localhost:8083}
    audit: ${AUDIT_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    "[com.sutra]": INFO
